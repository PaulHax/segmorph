name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run typecheck

      - run: npm test

      - run: npm run build

      # The tarball contents are part of the contract: dist plus notices, never
      # src, test, oracles, or examples.
      - run: npm pack --dry-run

  # The oracle tier regenerates every algorithm's goldens live with the pinned
  # oracle environment, so a VTK, PolySeg, or ITK bump can never leave stale
  # committed goldens silently passing. It also runs the two live-only suites:
  # the property-based sweep over seeded random blobs, and the clinical
  # regression against Slicer's conversion on a real chest CT. Kept out of
  # `verify` so the default test run stays Python-free.
  oracle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: oracles/py/uv.lock

      # The clinical oracle downloads LIDC2 once and reuses it from this cache.
      # The key carries the dataset's pinned content hash, so a re-pin fetches
      # fresh data instead of silently reusing the old volume.
      - uses: actions/cache@v4
        with:
          path: oracles/.cache
          key: clinical-dataset-lidc2-d697a46d

      - run: npm ci

      - run: npm run test:oracle
